# ============================================
# 服务器配置
# ============================================

# server 配置节：配置内嵌的 Web 服务器
server:
  # 端口配置：指定应用程序监听的端口号
  port: 8080
  # servlet 相关配置
  servlet:
    # 上下文路径：所有请求的前缀，访问时需要加上 /api
    # 例如：http://localhost:8080/api/xxx
    context-path: /api

# ============================================
# 静态资源 / 上传文件配置
# ============================================

# spring 配置节：Spring Boot 核心配置
spring:
  # 静态资源配置
  web:
    resources:
      # 静态资源位置（内置示例图在 static/images，上传文件通过 WebMvcConfig 单独映射）
      static-locations:
        - classpath:/static/
      # 允许映射
      add-mappings: true

  # ============================================
  # 数据源配置（数据库连接配置）
  # ============================================
  datasource:
    # 数据库连接 URL：
    # jdbc:mysql:// - JDBC 连接 MySQL 数据库的协议
    # localhost:3306 - 数据库服务器地址和端口
    # history - 数据库名称
    # useSSL=false - 禁用 SSL 连接（开发环境常用）
    # serverTimezone=Asia/Shanghai - 设置服务器时区为上海时间
    # allowPublicKeyRetrieval=true - 允许公钥检索（解决 MySQL 8.0 认证问题）
    # characterEncoding=utf-8 - 设置字符编码
    url: jdbc:mysql://localhost:3306/history?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8

    # 数据库用户名
    username: root

    # 数据库密码（注意：YAML 中纯数字需要引号，否则会被解析为数字类型）
    password: "1q2w3e4r"

    # JDBC 驱动类名：
    # MySQL Connector/J 8.0+ 的驱动类
    # 对应 Maven 依赖：mysql-connector-java 或 mysql-connector-j
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      # 单个文件最大大小（这里设置为100MB，可根据需求调整）
      max-file-size: 100MB
      # 单次请求总文件大小（这里设置为200MB）
      max-request-size: 200MB
      # 是否启用文件上传支持（默认true）
      enabled: true

# ============================================
# 图片/文件上传配置
# ============================================
image:
  # 上传文件的物理存储目录（建议使用独立目录，不要写进前端源码）
  # 支持 ${user.home} 等占位符；也可通过环境变量 UPLOAD_PATH 覆盖
  upload:
    path: ${UPLOAD_PATH:./upload}
  # 前端访问的URL前缀（由 WebMvcConfig 映射到上面的物理目录）
  access:
    prefix: /images/

# ============================================
# JWT 配置
# ============================================
jwt:
  # 签名密钥（至少 32 个字符）。生产环境请用环境变量 JWT_SECRET 覆盖，切勿使用默认值
  secret: ${JWT_SECRET:ailab-back-secret-key-1234567890-abcdefghijklmn}
  # Token 有效期（毫秒），默认 2 小时
  expiration: 7200000

# ============================================
# 数据库备份配置
# ============================================
db:
  backup:
    # 备份文件存储目录：绝对路径，或相对于应用启动目录的相对路径
    # 说明：原配置把备份目录放在 classpath 下，打成 jar 后无法写入，已改为普通目录
    dir: ${BACKUP_DIR:db}
    # 备份文件时间格式（决定文件名，也是恢复/删除时的校验规则）
    date-format: "yyyy-MM-dd HH-mm-ss"
    # mysqldump / mysql 可执行文件路径，默认使用环境变量 PATH
    mysqldump: mysqldump
    mysql: mysql
    # 单次备份/恢复超时时间（秒）
    timeout-seconds: 120

# ============================================
# 硅基流动 AI 配置
# ============================================
siliconflow:
  # API密钥：优先读取环境变量 SILICONFLOW_API_KEY
  # 获取方式：登录 https://siliconflow.cn 控制台 -> API Keys
  api-key: ${SILICONFLOW_API_KEY:}
  # API接口地址：硅基流动聊天接口
  api-url: https://api.siliconflow.cn/v1/chat/completions
  # 默认使用的AI模型
  default-model: Qwen/Qwen2.5-7B-Instruct
  # 最大生成Token数：控制回答的长度
  max-tokens: 500
  # 温度参数：控制回答的随机性（0-1）
  temperature: 0.7
  # 请求超时时间（秒）
  timeout: 30

# ============================================
# 日志配置
# ============================================
logging:
  level:
    # 项目包日志级别
    com.ailab.back: INFO
    # Hibernate SQL 日志（排查问题时改为 DEBUG）
    org.hibernate.SQL: INFO
